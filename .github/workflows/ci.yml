name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Exactly what an outside contributor gets: a clone with none of the gitignored
  # private modules. Setup must succeed and `make doctor` must exit 0 (private
  # checks WARN, never FAIL). This is the path that broke for a first-time
  # contributor in 2026-09; keep it green.
  fresh-clone-setup:
    runs-on: ubuntu-latest
    env:
      DB_BACKEND: sqlite
      SQLITE_DB_PATH: nfl_data.db
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - name: Install dependencies
        run: |
          pip install uv
          uv venv
          uv pip install -r requirements.txt
      - name: Private files must not be tracked
        run: ./scripts/check_private_files_untracked.sh
      - name: Migrate an empty database
        run: uv run python -m scripts.run_migrations
      - name: make doctor exits 0 on a public clone
        run: |
          uv run python -m scripts.preflight --check-schema --json | tee doctor.json
          uv run python - <<'PY'
          import json
          report = json.load(open("doctor.json"))
          failed = [c["name"] for c in report["checks"] if c["status"] == "fail"]
          assert report["ok"] and not failed, f"doctor FAIL on a public clone: {failed}"
          statuses = {c["name"]: c["status"] for c in report["checks"]}
          assert statuses["private_modules"] == "warn", statuses
          PY
      - name: Test collection has no import errors without private modules
        run: uv run python -m pytest tests/ --collect-only -q

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - name: Install dependencies
        run: |
          pip install uv
          uv venv
          uv pip install -r requirements.txt
      - name: Run tests
        run: |
          DB_BACKEND=sqlite SQLITE_DB_PATH=nfl_data.db uv run python -m pytest tests/ -v --cov=. --cov-report=xml
        env:
          DB_BACKEND: sqlite
          SQLITE_DB_PATH: nfl_data.db
      # Gate logic only. CI has no projection data, so the real-data run lives in
      # `make mae-gate`; this asserts the thresholds and skip rules stay correct.
      - name: Check model quality gate logic
        run: |
          uv run python -m pytest tests/test_nfl_projection_evaluation.py -q
        env:
          DB_BACKEND: sqlite
          SQLITE_DB_PATH: nfl_data.db
      - name: Upload coverage
        uses: codecov/codecov-action@v4
        with:
          file: ./coverage.xml
          fail_ci_if_error: false

  pipeline-database-matrix:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: nfl_test
          MYSQL_USER: nfl
          MYSQL_PASSWORD: nfltest
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -unfl -pnfltest"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - name: Install dependencies
        run: |
          pip install uv
          uv venv
          uv pip install -r requirements.txt
      - name: Run MySQL queue and lease matrix
        env:
          TEST_DB_BACKEND: mysql
          TEST_DB_URL: mysql://nfl:nfltest@127.0.0.1:3306/nfl_test
        run: uv run python -m pytest tests/test_pipeline_database_matrix.py -v

  lint-frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install and lint
        working-directory: frontend
        run: |
          npm ci
          npm run lint
          npm run build
